# What the play page (apps/play) offers on a normal server: the decks a player
# may take and the opponents (a checkpoint under `serve --models` and the deck it
# plays). The page shows exactly this and the server refuses anything else.
# `serve --dev` ignores this file and offers every checkpoint, every matchup,
# the scripted bots and the dev scenarios. Use `serve --play-config PATH` for
# another offer. A player deck that has no matchup (match.MATCHUPS) with any
# offered opponent is listed but cannot be chosen.
#
# [models."<name>"] pins a checkpoint: `<name>.pt` under the models directory
# must have this SHA-256 and feature-set version. A local server skips an
# opponent whose checkpoint is missing; a hosted server (mtg_ml.hosted) refuses
# to start unless every one is present and matches (live.validate_offer).
# Weights stay outside Git. Pin a fixed snapshot, never a trainer's latest.pt.
#
# Each [[opponents]] may also carry, all optional (older configs without them work):
#   description  one or two plain sentences shown on the opponent picker
#   tested       how well the opponent is tested: "well", "some" or "experimental"
# `[recommended_matchup]` (optional) names two decks whose matchup the page
# highlights, in either seat: decks = [a, b] and a short note.

player_decks = ["jund_wildfire", "mono_blue_terror", "red_madness", "grixis_affinity", "elves", "tron"]

# The most tested matchup: a standing benchmark with specialist and legacy bots,
# ladder Elo, thousands of benchmark games and human playtests.
[recommended_matchup]
decks = ["jund_wildfire", "mono_blue_terror"]
note = "Jund Wildfire vs Mono Blue Terror is the most tested matchup, with a standing benchmark and human playtests. Play it from either seat."

