# What the play page (apps/play) offers on a normal server: the decks a player
# may take and the opponents (a checkpoint under `serve --models` and the deck it
# plays). The page shows exactly this and the server refuses anything else.
# `serve --dev` ignores this file and offers every checkpoint, every matchup,
# the scripted bots and the dev scenarios. Use `serve --play-config PATH` for
# another offer. A player deck that has no matchup (match.MATCHUPS) with any
# offered opponent is listed but cannot be chosen.
#
# [models."<name>"] pins a checkpoint: `<name>.pt` under the models directory
# must have this SHA-256 and feature-set version. A local server skips an
# opponent whose checkpoint is missing; a hosted server (mtg_ml.hosted) refuses
# to start unless every one is present and matches (live.validate_offer).
# Weights stay outside Git. Pin a fixed snapshot, never a trainer's latest.pt.

player_decks = ["jund_wildfire", "mono_blue_terror", "red_madness", "grixis_affinity", "elves", "tron"]

[models."r7-lr075/policy"]
sha256 = "672aaa0c2764f853198c44a6fa7847469e01d9767952ea3fb8e9d84e068f636e"
features = 7
games = 8353792
source = "h100-private:~/mtg-ml-checkpoints/20261008-r7-fs7-h256-lr075/policy.pt"
evaluation = "final r7 lr075 policy (iteration 4079, run stopped); ledger 20261009-specialist-benchmark (PR #72): greedy Jund 70.8% vs legacy Blue, 49.0% vs the Blue specialist, Blue 75.7% vs the Jund specialist"
trained_at = "4a32795"  # training code (PR #68 head)
runtime = "b06fac4"  # first default-branch commit that plays feature set 7 (#63); later revisions keep it

[models."r8-jund-blue/policy"]
sha256 = "b2ca176382139cf5f6733937605e43b836af1973b18624e8ae19d68a850c9e71"
features = 7
games = 6000640
source = "h100-private:~/mtg-ml-eval/ckpt/r8-jund-blue-final.pt (copy of ~/mtg-ml-r8/campaigns/r8-20261009/r8-jund-blue-ft/policy/v02930.pt)"
evaluation = "final r8 Jund vs Blue fine-tune (run 20261009-r8-fs7h256-mu-jund-blue-ft-r7-lr075-s8, 6.0M games); specialist benchmark, 100 blocks, --contract fair, on h100-private, sampled / greedy: jund_vs_sblue 75.2/79.0, blue_vs_sjund 83.8/84.0, jund_vs_sjund 58.3/62.7, blue_vs_sblue 65.2/66.0, jund_vs_lblue 82.0/84.8, blue_vs_ljund 92.7/92.7 (r4-control 64.0/65.5 and r7-lr075 46.3/49.0 on jund_vs_sblue)"
trained_at = "889798b"  # training code

[models."r4-control/policy"]
sha256 = "cb19222d1868a72671c73c80268d75aea977e87758493804c80f895f85024f72"
features = 3
source = "h100-private:~/mtg-ml-checkpoints/20261007-r4-control/policy.pt"
evaluation = "round 4 control (docs/experiments/ledger.md); legacy, kept for its sampled Delver play"

