# Equipment. Job select: the ETB trigger makes a 1/1 Hero and attaches the
# Rod to it. The equipped creature's granted trigger is the Rod's own
# you_cast trigger with condition equipped (same controller, same timing;
# the Rod is the damage source, which nothing in the pool can tell apart).
# The Wizard type it grants is not tracked (nothing in the pool reads it).
[[card]]
name = "Black Mage's Rod"
cost = "{1}{B}"
types = "Artifact"
subtypes = "Equipment"
