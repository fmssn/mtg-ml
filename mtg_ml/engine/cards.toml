# The pool has no Dragons, so "each non-Dragon creature" is each creature.
[[card]]
name = "Breath Weapon"
cost = "{2}{R}"
types = "Instant"
text = "Breath Weapon deals 2 damage to each non-Dragon creature."
effect = [{ op = "damage_each_creature", n = 2 }]

# The engine has no graveyard targets: the (up to two) cards are chosen as
# the ability resolves.
[[card]]
name = "Faerie Macabre"
cost = "{1}{B}{B}"
types = "Creature"
subtypes = "Faerie Rogue"
text = "Flying. Discard this card: Exile up to two target cards from graveyards."
power = 2
toughness = 2
keywords = ["flying"]
abilities = [{ name = "exile up to two cards from graveyards", zone = "hand", discard_self = true, effect = [{ op = "exile_from_graveyards", n = 2 }] }]

[[card]]
name = "Terminate"
cost = "{B}{R}"
types = "Instant"
text = "Destroy target creature. It can't be regenerated."
targets = ["creature"]
effect = [{ op = "destroy_target" }]

# "Up to two target creatures" as two modes: one creature, or two different ones.
[[card]]
name = "Cast into the Fire"
cost = "{1}{R}"
types = "Instant"
text = "Choose one - 1 damage to each of up to two target creatures; or exile target artifact."
modes = [
    { name = "one creature", targets = ["creature"], effect = [{ op = "damage_target", n = 1 }] },
    { name = "two creatures", targets = ["creature", "another_creature"], effect = [{ op = "damage_target", n = 1 }, { op = "damage_target", index = 1, n = 1 }] },
    { name = "exile", targets = ["artifact"], effect = [{ op = "exile_target" }] },
]

[[card]]
name = "End the Festivities"
cost = "{R}"
types = "Sorcery"
text = "End the Festivities deals 1 damage to each opponent and each creature and planeswalker they control."
effect = [{ op = "damage_each_opponent", n = 1 }, { op = "damage_each_creature", n = 1, whose = "opponent" }]

# The damage goes first: it needs the artifact's controller, and nothing can
# happen between the two.
[[card]]
name = "Smash to Smithereens"
cost = "{1}{R}"
types = "Instant"
text = "Destroy target artifact. Smash to Smithereens deals 3 damage to that artifact's controller."
targets = ["artifact"]
effect = [{ op = "damage_target_controller", n = 3 }, { op = "destroy_target" }]

[[card]]
name = "Ancient Grudge"
cost = "{1}{R}"
types = "Instant"
text = "Destroy target artifact. Flashback {G}."
targets = ["artifact"]
effect = [{ op = "destroy_target" }]
flashback = "{G}"
