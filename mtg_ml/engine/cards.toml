[[card]]
name = "Slagwoods Bridge"
types = "Artifact Land"
text = "Enters tapped. Indestructible. {T}: Add {R} or {G}."
keywords = ["indestructible"]
enters_tapped = true
abilities = [{ name = "add R/G", tap = true, mana = ["R", "G"] }]

[[card]]
name = "Vault of Whispers"
types = "Artifact Land"
text = "{T}: Add {B}."
abilities = [{ name = "add B", tap = true, mana = ["B"] }]

[[card]]
name = "Twisted Landscape"
types = "Land"
text = "{T}: Add {C}. {T}, Sacrifice: search for a basic Swamp, Mountain, or Forest, put it onto the battlefield tapped. Cycling {B}{R}{G}."
abilities = [
    { name = "add C", tap = true, mana = ["C"] },
    { name = "search for a basic land", tap = true, sac_self = true, effect = [
        { op = "search_library", supertype = "Basic", type = "Land", subtypes_any = ["Swamp", "Mountain", "Forest"], dest = "battlefield", tapped = true, what = "a basic Swamp, Mountain, or Forest card" },
    ] },
    { name = "cycling {B}{R}{G}", cost = "{B}{R}{G}", zone = "hand", discard_self = true, effect = [{ op = "draw", n = 1 }] },
]

