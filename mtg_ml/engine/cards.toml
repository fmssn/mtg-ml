# Card pool: the single source of truth for both engines.
#
# The Python reference engine (mtg_ml/engine/cards.py) and the Rust port
# (native/src/cards.rs) both load this file. Static characteristics, costs,
# targets, abilities and triggers are data. Effects are lists of ops run in
# order; ops are implemented once per engine (see docs/adding-cards.md for the
# op reference). A card that only uses existing ops needs no code at all.
#
# Field reference (all optional unless noted):
#   name (required), cost ("{1}{U}"), types (required, space separated),
#   subtypes, supertypes, text, devoid, colors (override, e.g. a colour
#   indicator), power, toughness, keywords, ward, targets (list of target
#   kinds), effect (list of ops), additional_sac, cost_reduction, flashback,
#   escape, escape_exile, bestow, enters_tapped, etb_x_counters, back (name
#   of a [[face]]), modes, abilities, triggers, madness, plot, overload and
#   overload_effect, additional_discard, alternative_cost and flashback_cost
#   ({ sacrifice = "mountain", n = N }: lands sacrificed instead of mana).
# Abilities: name (required), cost, tap, sac_self, sac_other, discard_self,
#   discard_other, exile_self, x_target_mv (X = the target's mana value),
#   x_reveal ("red": X red cards revealed from hand), zone ("battlefield" |
#   "hand"), sorcery_speed, mana (list of colours: a mana ability), targets,
#   effect.
# Triggers: name (required), event (etb | to_graveyard_from_battlefield |
#   cast | you_sacrifice_another | your_upkeep | you_cast | third_draw),
#   effect, condition.

