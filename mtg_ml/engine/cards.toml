# ---------------------------------------------------------------------------
# Dungeons (initiative: Avenging Hunter)
# ---------------------------------------------------------------------------

# The Undercity. Rooms are triggered abilities of the dungeon, first room on
# top; `next` are the rooms below. Arena (goad target creature) is left
# out: the engine has no attack requirements. Forge therefore leads only to
# Trap! and Lost Well only to Stash.
[[dungeon]]
name = "Undercity"
rooms = [
    { name = "Secret Entrance", next = ["Forge", "Lost Well"], effect = [
        { op = "search_library", supertype = "Basic", type = "Land", dest = "hand", reveal = true, what = "a basic land card" },
    ] },
    { name = "Forge", next = ["Trap!"], targets = ["creature"], effect = [{ op = "counters_target", n = 2 }] },
    { name = "Lost Well", next = ["Stash"], effect = [{ op = "scry", n = 2 }] },
    { name = "Trap!", next = ["Archives"], targets = ["player"], effect = [{ op = "lose_life", who = "target_player", n = 5 }] },
    { name = "Stash", next = ["Catacombs"], effect = [{ op = "create_token", token = "Treasure", n = 1 }] },
    { name = "Archives", next = ["Throne of the Dead Three"], effect = [{ op = "draw", n = 1 }] },
    { name = "Catacombs", next = ["Throne of the Dead Three"], effect = [{ op = "create_token", token = "Skeleton", n = 1 }] },
    { name = "Throne of the Dead Three", effect = [{ op = "reveal_to_battlefield", n = 10, type = "Creature", counters = 3, hexproof = true }] },
]

