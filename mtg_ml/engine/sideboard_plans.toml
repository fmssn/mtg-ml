# Sideboard plans: what each deck boards in and out for games 2 and 3 of a
# match, by opponent. One [[plan]] per ordered (deck, opponent) pair; every
# pair of decks in decks.DECKS needs one in each direction.
#
#   deck, opponent   keys of decks.DECKS
#   why              one line: what the swap is for
#   in               cards from decks.SIDEBOARDS[deck] -> maindeck
#   out              maindeck cards -> sideboard (same total as `in`)
#
# Counts are relative to the registered maindeck, never to a previous game's
# deck. mtg_ml/engine/sideboard.py validates every row at import (counts
# available, 60 / 15, at most 4 copies). The scripted PlanMatrixPolicy
# (mtg_ml/match.py) plays exactly this table; docs/sideboarding.md explains
# how a learned policy replaces it.

# Plans among the first three decks, 2026-10-07: from card knowledge and the
# Q3 2026 matchup data of Pauper-Research (reports/2026-Q3/combined/
# matchups.csv, the row deck's match win rate): Jund v Blue 46% (61
# matches), Jund v Red 31% (86), Blue v Red 65% (100).

[[plan]]
deck = "jund_wildfire"
opponent = "mono_blue_terror"
why = "Duress and Pyroblast fight counters and card draw, Faerie Macabre shrinks Terror's discount, Terminate is extra removal; lifegain, Wildfire against basics and the slow Hydra out."
in = { "Duress" = 3, "Pyroblast" = 2, "Faerie Macabre" = 1, "Terminate" = 1 }
out = { "Lembas" = 2, "Cleansing Wildfire" = 2, "Makeshift Munitions" = 1, "Nyxborn Hydra" = 1, "Toxin Analysis" = 1 }

[[plan]]
deck = "mono_blue_terror"
opponent = "jund_wildfire"
why = "Annul counters Jund's many artifacts (Familiar, Wellspring, Spellbomb, Lembas) and the Hydra, Hydroblast its red cards; Force Spike and the sorcery-speed removal out."
in = { "Annul" = 4, "Hydroblast" = 2 }
out = { "Force Spike" = 3, "Sleep of the Dead" = 2, "Deem Inferior" = 1 }

[[plan]]
deck = "jund_wildfire"
opponent = "red_madness"
why = "Life and board against burn: Weather the Storm, Breath Weapon sweeps the x/1s and x/2s, Terminate; Wildfire does nothing against basic Mountains, the Hydra and Insight are slow."
in = { "Weather the Storm" = 3, "Breath Weapon" = 2, "Terminate" = 1 }
out = { "Cleansing Wildfire" = 4, "Nyxborn Hydra" = 1, "Eviscerator's Insight" = 1 }

[[plan]]
deck = "red_madness"
opponent = "jund_wildfire"
why = "End the Festivities and Cast into the Fire clear Spawn, Shaman, Infiltrator and Familiar (or exile an artifact), Searing Blaze kills Chrysalis; the weakest threats and slow card draw out."
in = { "End the Festivities" = 2, "Cast into the Fire" = 2, "Searing Blaze" = 2 }
out = { "Voldaren Epicure" = 2, "Highway Robbery" = 2, "Guttersnipe" = 1, "Sneaky Snacker" = 1 }

[[plan]]
deck = "mono_blue_terror"
opponent = "red_madness"
why = "Hydroblast and Blue Elemental Blast counter burn and kill red creatures, Gut Shot kills the x/1s for free; Force Spike, the slow removal and a Ponder out."
in = { "Hydroblast" = 4, "Blue Elemental Blast" = 2, "Gut Shot" = 2 }
out = { "Force Spike" = 3, "Sleep of the Dead" = 2, "Deem Inferior" = 2, "Ponder" = 1 }

[[plan]]
deck = "red_madness"
opponent = "mono_blue_terror"
why = "Pyroblast and Red Elemental Blast answer every blue card, Relic of Progenitus starves Terror and Serpent; the slow card draw and Epicure out."
in = { "Pyroblast" = 4, "Red Elemental Blast" = 2, "Relic of Progenitus" = 2 }
out = { "Highway Robbery" = 4, "Grab the Prize" = 2, "Voldaren Epicure" = 2 }
