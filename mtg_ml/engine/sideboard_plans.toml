in = { "End the Festivities" = 2, "Cast into the Fire" = 2, "Searing Blaze" = 2 }
out = { "Voldaren Epicure" = 2, "Highway Robbery" = 2, "Guttersnipe" = 1, "Sneaky Snacker" = 1 }

