<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mtg-ml Training Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b57'/%3E%3Cpath d='M6 23V17H11V11H16V19H21V7H26' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f4;--surface:#fff;--fg:#1d2321;--muted:#5d6763;--line:#d9ddd8;
  --accent:#2f6b57;--accent-soft:#e3efe9;--ok:#2f7d4f;--warn:#a86b12;--bad:#b03a2e;--pending:#6a6f86;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#8e55c7;--c5:#c19a1c;--c6:#d1427a;--c7:#2b9db5;--c8:#7b8a2f;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917;--surface:#1b2220;--fg:#e4e9e6;--muted:#9aa5a0;--line:#2f3936;--accent:#7fc4a8;--accent-soft:#1f322b;
  --ok:#6cc58f;--warn:#e0a54a;--bad:#ec7a6c;--pending:#a3a8c4;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#a47be0;--c5:#d4ae3a;--c6:#e0689a;--c7:#3fb4cc;--c8:#9aab4a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917;--surface:#1b2220;--fg:#e4e9e6;--muted:#9aa5a0;--line:#2f3936;--accent:#7fc4a8;--accent-soft:#1f322b;
  --ok:#6cc58f;--warn:#e0a54a;--bad:#ec7a6c;--pending:#a3a8c4;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#a47be0;--c5:#d4ae3a;--c6:#e0689a;--c7:#3fb4cc;--c8:#9aab4a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0;padding:28px 16px 64px}
main,#live,#history{grid-template-columns:minmax(0,1fr)}
main{max-width:1240px;margin:0 auto;display:grid;gap:26px}
main>*{min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--fg)}
h3{font-size:16px;font-weight:600}
a{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px}
.right{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
button,select,input{font:13px var(--mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:6px}nav button[aria-pressed=true]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.bad{background:var(--bad)}.dot.stale{background:var(--warn)}
.banner{background:var(--accent-soft);border-radius:6px;padding:12px 16px;font-size:14px}.banner.bad{color:var(--bad);border:1px solid var(--bad)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.card.off{opacity:.55}
.card head,.card .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.pill{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.pend{color:var(--pending)}.ref{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px}
.tile small{display:block;font-family:var(--display);font-size:12px;color:var(--muted)}
.tile b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.tile b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 14px 10px;display:grid;gap:8px;min-width:0}
.fig h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
svg.viz{width:100%;height:auto;display:block;overflow:visible}
svg.viz text{font:11px var(--mono);fill:var(--muted)}
svg.viz text.endlabel{fill:var(--fg);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
svg.viz .grid{stroke:var(--line)}svg.viz .axis{stroke:var(--muted)}svg.viz .ref{stroke:var(--muted);stroke-dasharray:2 3;opacity:.8}
svg.viz .xhair{stroke:var(--muted)}
.tip{position:fixed;pointer-events:none;z-index:9;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:12px var(--mono);box-shadow:0 2px 10px #0003;display:none;max-width:340px}
.tip b{font-family:var(--display)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}th[aria-sort=ascending]::after{content:" ▲"}th[aria-sort=descending]::after{content:" ▼"}
tr.row{cursor:pointer}tr.row:hover td{background:var(--accent-soft)}
tr.detail td{background:var(--bg);font-size:13px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-family:var(--mono);font-size:12px}.kv span:nth-child(odd){color:var(--muted)}
.kv span{overflow-wrap:anywhere}
details summary{cursor:pointer;font-family:var(--display);font-size:13px;color:var(--muted)}
pre{margin:6px 0 0;font:11.5px/1.4 var(--mono);white-space:pre-wrap;max-height:220px;overflow:auto;background:var(--bg);padding:8px;border-radius:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{cursor:pointer;display:inline-flex;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font:12px var(--mono);background:var(--surface)}
.chip[aria-pressed=false]{opacity:.45}
.gpu{display:grid;gap:4px;font-family:var(--mono);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
@media (max-width:560px){h1{font-size:26px}.tiles{grid-template-columns:repeat(2,1fr)}.grid.wide{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
  <div><div class="eyebrow">mtg-ml · training</div><h1>Training Tracker</h1></div>
  <div class="right"><nav aria-label="View"><button id="tab-live" aria-pressed="true">Live</button><button id="tab-history" aria-pressed="false">History</button></nav>
    <span id="conn"><span class="dot stale"></span>connecting</span><button id="theme" title="Toggle light/dark">theme</button></div>
</header>
<div id="banner"></div>
<section id="live" style="display:grid;gap:26px"></section>
<section id="history" style="display:none;gap:26px"></section>
</main>
<div class="tip" id="tip"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt={
  n:(x,d=0)=>x==null?'–':x.toLocaleString('en',{maximumFractionDigits:d,minimumFractionDigits:d}),
  big:x=>x==null?'–':x>=1e9?(x/1e9).toFixed(2)+'B':x>=1e6?(x/1e6).toFixed(2)+'M':x>=1e3?(x/1e3).toFixed(1)+'k':String(Math.round(x)),
  pct:x=>x==null?'–':(x*100).toFixed(1)+'%',
  dur:s=>{if(s==null)return'–';s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h>=48?(h/24).toFixed(1)+' d':h?h+'h '+String(m).padStart(2,'0')+'m':m+'m '+Math.floor(s%60)+'s'},
  age:s=>s==null?'–':s<90?Math.round(s)+'s ago':s<5400?Math.round(s/60)+'m ago':s<172800?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago',
};
const state={live:null,hist:null,hidden:new Set(),metric:null,xaxis:'games',sort:{key:'date',dir:-1},filter:'',open:new Set(),view:'live'};
const colors={};let colorN=0;
function nameRuns(runs){const n={};for(const r of runs)n[r.label]=(n[r.label]||0)+1;for(const r of runs)r.dn=n[r.label]>1&&r.campaign?r.campaign.replace(/^overnight-/,'')+' · '+r.label:r.label}
const colorOf=id=>colors[id]??(colors[id]=PAL[colorN++%PAL.length]);

/* ---------- theme ---------- */
const root=document.documentElement;
try{const t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}render()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>render());

/* ---------- line chart (SVG, no deps) ---------- */
function niceTicks(lo,hi,n=5){if(lo===hi){hi=lo+1}const raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,
  step=(f<1.5?1:f<3?2:f<7?5:10)*p,out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+step*1e-6;v+=step)out.push(+v.toFixed(10));return out}
/* series: [{name,color(var),points:[[x,y,label?]],dots:bool,dash:bool}] */
function lineChart(el,series,o={}){
  const W=640,H=o.h||240,m={l:46,r:o.endLabels===false?14:70,t:10,b:28};
  const pts=series.flatMap(s=>s.points.filter(p=>p[1]!=null&&isFinite(p[1])));
  if(!pts.length){el.innerHTML='<div class="empty" style="padding:24px">no data yet</div>';return}
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
  if(o.y0!=null)y0=Math.min(y0,o.y0);if(o.y1!=null)y1=Math.max(y1,o.y1);
  if(x0===x1)x1=x0+1;const pad=(y1-y0||1)*.06;if(o.y0==null)y0-=pad;if(o.y1==null)y1+=pad;
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  const yt=niceTicks(y0,y1,4),xt=o.xticks||niceTicks(x0,x1,5).map(v=>[v,(o.fx||fmt.big)(v)]);
  let g='';
  for(const v of yt)g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${(o.fy||(x=>fmt.n(x,Math.abs(x)<10?2:0)))(v)}</text>`;
  g+=`<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/>`;
  for(const [v,l] of xt)if(v>=x0&&v<=x1)g+=`<text x="${X(v)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`;
  for(const r of o.refs||[])g+=`<line class="ref" x1="${m.l}" x2="${W-m.r}" y1="${Y(r)}" y2="${Y(r)}"/>`;
  const used=[];
  for(const s of series){const c=`var(${s.color})`,P=s.points.filter(p=>p[1]!=null&&isFinite(p[1]));if(!P.length)continue;
    if(!s.noline&&P.length>1)g+=`<polyline fill="none" stroke="${c}" stroke-width="2" ${s.dash?'stroke-dasharray="5 3"':''} stroke-linejoin="round" points="${P.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
    if(s.dots||P.length===1)for(const p of P)g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.r||3}" fill="${c}"/>`;
    const last=P[P.length-1];if(o.endLabels!==false){let ly=Y(last[1])+4;for(const u of used)if(Math.abs(u-ly)<12)ly=u+12*(ly>=u?1:-1);used.push(ly);
      g+=`<text class="endlabel" x="${X(last[0])+7}" y="${ly}">${(o.fy||(x=>fmt.n(x,Math.abs(x)<10?2:0)))(last[1])}</text>`}}
  el.innerHTML=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'chart')}">${g}<line class="xhair" y1="${m.t}" y2="${H-m.b}" style="display:none"/></svg>`;
  const svg=$('svg',el),xh=$('.xhair',svg),tip=$('#tip');
  svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*W;
    if(vx<m.l||vx>W-m.r){svg.onmouseleave();return}
    const xv=x0+(vx-m.l)/(W-m.l-m.r)*(x1-x0);let rows=[],best=null;
    for(const s of series){let b=null;for(const p of s.points)if(p[1]!=null&&isFinite(p[1])&&(b===null||Math.abs(p[0]-xv)<Math.abs(b[0]-xv)))b=p;
      if(b){rows.push(`<div><span class="swatch" style="background:var(${s.color})"></span>${esc(s.name)}: <b>${(o.fy||(x=>fmt.n(x,3)))(b[1])}</b>${b[2]?' · '+esc(b[2]):''}</div>`);if(!best||Math.abs(b[0]-xv)<Math.abs(best-xv))best=b[0]}}
    xh.setAttribute('x1',X(best));xh.setAttribute('x2',X(best));xh.style.display='';
    tip.innerHTML=`<b>${esc((o.fx||fmt.big)(best))}</b>${rows.join('')}`;tip.style.display='block';
    tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'};
  svg.onmouseleave=()=>{xh.style.display='none';tip.style.display='none'};
}
function figure(title,sub){const f=document.createElement('figure');f.className='fig';f.innerHTML=`<h3>${esc(title)}<span class="note">${esc(sub||'')}</span></h3><div class="plot"></div><div class="legend"></div>`;return f}
function legend(f,ser){$('.legend',f).innerHTML=ser.map(s=>`<span><span class="swatch" style="background:var(${s.color})"></span>${esc(s.name)}</span>`).join('')}

/* ---------- live view ---------- */
function xOf(run,row){return state.xaxis==='games'?row.games_total:row.elapsed_s/3600}
function smooth(a,k=10){return a.map((v,i)=>{if(v==null)return null;let s=0,n=0;for(let j=Math.max(0,i-k+1);j<=i;j++)if(a[j]!=null){s+=a[j];n++}return s/n})}
function liveRuns(){return (state.live?.runs||[]).filter(r=>!state.hidden.has(r.id))}
const pillCls={running:'ok',finished:'ok',queued:'pend',stopped:'warn',failed:'bad',interrupted:'bad'};
function lastEval(r){return r.evals.length?r.evals[r.evals.length-1]:null}
function primaryBench(runs){const keys={};for(const r of runs)for(const e of r.evals)for(const k of Object.keys(e.bench))keys[k]=(keys[k]||0)+1;
  const ks=Object.keys(keys).sort((a,b)=>keys[b]-keys[a]);return ks}
function renderLive(){
  const S=state.live,el=$('#live');
  if(!S){el.innerHTML='<div class="empty">Waiting for the first snapshot…</div>';return}
  const all=S.runs,runs=liveRuns();
  const ks=primaryBench(all);if(!state.metric||!ks.includes(state.metric))state.metric=ks.find(k=>k.includes('jund_vs_bot'))||ks[0]||null;
  let h='';
  const run=all.filter(r=>r.status==='running').length;
  h+=`<div class="toolbar"><span class="note">${all.length} runs · ${run} running${S.hidden?` · ${S.hidden} older hidden`:''}</span>
   <span style="flex:1"></span><label class="note">x axis <select id="xax"><option value="games">games</option><option value="hours">hours</option></select></label>
   <label class="note">benchmark <select id="metric">${ks.map(k=>`<option ${k===state.metric?'selected':''}>${esc(k)}</option>`).join('')||'<option>none</option>'}</select></label></div>`;
  if(!all.length)h+=`<div class="empty">No runs discovered under the configured roots yet. A run shows up as soon as a campaign manifest or a <span class="mono">metrics.jsonl</span> appears.</div>`;
  if(S.gpus?.length){h+=`<div><h2>Machine</h2></div><div class="grid">${S.gpus.map(g=>{const u=g.utilization||0,mem=g.total_mib?g.used_mib/g.total_mib:0;
    return `<div class="card"><div class="head"><h3>GPU ${g.index} <span class="note">${esc(g.name)}</span></h3><span class="mono note">${g.temperature??'–'}°C · ${fmt.n(g.power_w)} W</span></div>
     <div class="gpu"><div>util ${fmt.n(u)}%</div><div class="bar"><i style="width:${u}%"></i></div><div>mem ${fmt.n(g.used_mib/1024,1)} / ${fmt.n(g.total_mib/1024,0)} GiB</div><div class="bar"><i style="width:${mem*100}%"></i></div></div></div>`}).join('')}
    <div class="card"><h3>Host <span class="note">${esc(S.host)}</span></h3><div class="gpu"><div>load ${S.load.map(x=>fmt.n(x,1)).join(' / ')} on ${S.cpu_count} cores</div>${S.disk?`<div>disk free ${fmt.n(S.disk.free/2**30,0)} of ${fmt.n(S.disk.total/2**30,0)} GiB</div>`:''}</div></div></div>`}
  if(all.length){
  h+=`<div><h2>Runs</h2></div><div class="chips" id="chips">${all.map(r=>`<span class="chip" role="button" tabindex="0" aria-pressed="${!state.hidden.has(r.id)}" data-id="${esc(r.id)}"><span class="swatch" style="background:var(${colorOf(r.id)})"></span>${esc(r.dn)}</span>`).join('')}</div>`;
  h+=`<div class="grid wide">${all.map(r=>runCard(r)).join('')}</div>`;
  h+=`<div><h2>Compare</h2></div><div class="grid wide" id="figs"></div>`;
  for(const c of S.campaigns||[]){if(c.alerts.length)h+=`<div class="banner bad">${esc(c.name)}: ${esc(c.alerts.join('; '))}</div>`;}
  const rep=(S.campaigns||[]).filter(c=>c.report_ready);
  if(rep.length)h+=`<p class="note">Morning reports: ${rep.map(c=>`<a href="report/${encodeURIComponent(c.name)}.md">${esc(c.name)}</a>`).join(' · ')}</p>`;
  }
  el.innerHTML=h;
  $('#xax')&&($('#xax').value=state.xaxis,$('#xax').onchange=e=>{state.xaxis=e.target.value;renderLive()});
  $('#metric')&&($('#metric').onchange=e=>{state.metric=e.target.value;renderLive()});
  for(const c of el.querySelectorAll('.chip'))c.onclick=c.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;const id=c.dataset.id;state.hidden.has(id)?state.hidden.delete(id):state.hidden.add(id);renderLive()};
  for(const d of el.querySelectorAll('details[data-id]'))d.ontoggle=()=>d.open?state.open.add(d.dataset.id):state.open.delete(d.dataset.id);
  if(all.length)renderFigs(runs);
}
function runCard(r){
  const e=lastEval(r),pg=r.target_games?Math.min(1,r.games/r.target_games):null,L=r.latest,off=state.hidden.has(r.id);
  const bv=e&&state.metric?e.bench[state.metric]:null,gv=e&&state.metric?e.greedy[state.metric]:null;
  const t=(a,b,u='')=>`<div class="tile"><small>${a}</small><b>${b}${u?` <em>${u}</em>`:''}</b></div>`;
  const flags=Object.entries(r.flags||{}).map(([k,v])=>`${k} ${v}`).join('\n');
  return `<div class="card${off?' off':''}"><div class="head"><h3><span class="swatch" style="background:var(${colorOf(r.id)})"></span>${esc(r.dn)}</h3><span class="pill ${pillCls[r.status]||'pend'}">${esc(r.status)}</span></div>
   <div class="note">${esc(r.campaign||r.path)}${r.pid?` · pid ${r.pid}`:''} · metrics ${fmt.age(r.metrics_age_s)}</div>
   ${pg!=null?`<div class="bar" title="${fmt.pct(pg)}"><i style="width:${pg*100}%"></i></div>`:''}
   <div class="tiles">${t('games',fmt.big(r.games),r.target_games?'/ '+fmt.big(r.target_games):'')}${t('iteration',fmt.n(r.iteration))}${t('elapsed',fmt.dur(r.elapsed_s))}
   ${t('games / h',fmt.big(r.games_per_hour))}${t('decisions / s',fmt.big(r.decisions_per_s))}${t('ETA',fmt.dur(r.eta_s))}
   ${t('bench',fmt.pct(bv))}${t('greedy',fmt.pct(gv))}${t('L1 Elo',e&&e.elo!=null?fmt.n(e.elo,1):'–',e&&e.elo_se!=null?'±'+fmt.n(e.elo_se,1):'')}
   ${t('entropy',fmt.n(L.entropy,3))}${t('KL',fmt.n(L.approx_kl,4))}${t('clip',fmt.pct(L.clip_frac))}${t('expl. var',fmt.n(L.explained_var,3))}${t('lr',L.lr?L.lr.toExponential(1):'–')}${t('seat-0/pool win',fmt.pct(L.win_vs_pool))}</div>
   <details data-id="${esc(r.id)}" ${state.open.has(r.id)?'open':''}><summary>flags and log</summary><div class="kv"><span>path</span><span>${esc(r.path)}</span><span>code</span><span>${esc(r.code_ref||'–')}</span><span>features</span><span>${esc(r.features??'–')}</span></div>${flags?`<pre>${esc(flags)}</pre>`:''}<pre>${esc(r.log||'(no train.log)')}</pre></details></div>`;
}
function renderFigs(runs){
  const box=$('#figs');box.innerHTML='';
  const xs=state.xaxis==='games'?{fx:fmt.big}:{fx:v=>v.toFixed(1)+' h'};
  const mk=(title,sub,fn,o={})=>{const f=figure(title,sub);box.appendChild(f);const ser=runs.map(r=>({name:r.dn,color:colorOf(r.id),...fn(r)})).filter(s=>s.points.length);
    lineChart($('.plot',f),ser,{title,...xs,...o});legend(f,ser)};
  const ev=(get,o={})=>r=>({points:r.evals.map(e=>[state.xaxis==='games'?e.games_total:e.elapsed_s/3600,get(e)]).filter(p=>p[0]!=null&&p[1]!=null),dots:true,...o});
  const ser=k=>r=>{const xv=r.series.map(s=>state.xaxis==='games'?s.games_total:s.elapsed_s/3600),y=smooth(r.series.map(s=>s[k]),8);return{points:xv.map((x,i)=>[x,y[i]]).filter(p=>p[0]!=null)}};
  mk('Ladder L1 Elo','vs reference ladder',ev(e=>e.elo));
  if(state.metric){mk('Benchmark, sampled',state.metric,ev(e=>e.bench[state.metric]),{fy:fmt.pct,refs:[.5]});
    mk('Benchmark, greedy',state.metric,ev(e=>e.greedy[state.metric]),{fy:fmt.pct,refs:[.5]})}
  mk('Entropy','smoothed',ser('entropy'));
  mk('Approx KL','smoothed',ser('approx_kl'),{fy:v=>fmt.n(v,4)});
  mk('Clip fraction','smoothed',ser('clip_frac'),{fy:fmt.pct});
  mk('Explained variance','smoothed',ser('explained_var'),{refs:[0]});
  mk('Games per hour','smoothed',ser('gph'),{fy:fmt.big});
  mk('Win rate vs pool','smoothed, seat-agnostic',ser('win_vs_pool'),{fy:fmt.pct,refs:[.5]});
}

/* ---------- history view ---------- */
const COLS=[['date','Date'],['id','Run'],['parent','Parent'],['games','Games',1],['sampled','Bench',1],['greedy','Greedy',1],['elo','L1 Elo',1],['verdict','Verdict']];
function renderHistory(){
  const el=$('#history'),H=state.hist;
  if(!H){el.innerHTML='<div class="empty">Loading ledger…</div>';return}
  let rows=H.runs.slice();
  const q=state.filter.toLowerCase();if(q)rows=rows.filter(r=>[r.id,r.parent,r.change,r.flags,r.verdict].join(' ').toLowerCase().includes(q));
  const {key,dir}=state.sort;rows.sort((a,b)=>{const x=a[key],y=b[key];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*dir});
  let h=`<div class="toolbar"><h2 style="flex:1;border:0">Experiments</h2><input id="q" placeholder="filter" value="${esc(state.filter)}"><span class="note">${rows.length} of ${H.runs.length} · from ledger.jsonl</span></div>
  <div class="grid wide" id="hfigs"></div>
  <div class="tablewrap"><table><thead><tr>${COLS.map(([k,l,n])=>`<th class="${n?'num':''}" data-k="${k}" ${state.sort.key===k?`aria-sort="${state.sort.dir>0?'ascending':'descending'}"`:''}>${l}</th>`).join('')}</tr></thead><tbody>`;
  for(const r of rows){
    h+=`<tr class="row" data-id="${esc(r.id)}"><td class="mono">${esc(r.date)}</td><td>${esc(r.id)}</td><td class="note">${esc(r.parent||'–')}</td><td class="num">${r.games?fmt.big(r.games):'–'}</td><td class="num">${fmt.pct(r.sampled)}</td><td class="num">${fmt.pct(r.greedy)}</td><td class="num">${fmt.n(r.elo,1)}</td><td><span class="pill ${r.verdict_class}">${esc((v=>v.length>24?v.slice(0,23)+'…':v)((r.verdict||'–').split(/[:(;]/)[0].trim()))}</span></td></tr>`;
    if(state.open.has('h:'+r.id))h+=`<tr class="detail"><td colspan="8"><div class="kv"><span>change</span><span>${esc(r.change||'–')}</span><span>verdict</span><span>${esc(r.verdict||'–')}</span><span>flags</span><span>${esc(r.flags||'–')}</span><span>code</span><span>${esc(r.code||'–')} ${r.engine?'· engine: '+esc(r.engine):''}</span><span>results</span><span>${esc(Object.entries(r.results||{}).map(([k,v])=>k+' = '+JSON.stringify(v)).join('\n'))}</span><span>archive</span><span>${esc(r.archive||'–')}</span></div></td></tr>`}
  h+='</tbody></table></div>';
  el.innerHTML=h;
  $('#q').oninput=e=>{state.filter=e.target.value;const p=e.target.selectionStart;renderHistory();const q=$('#q');q.focus();q.setSelectionRange(p,p)};
  for(const th of el.querySelectorAll('th'))th.onclick=()=>{const k=th.dataset.k;state.sort=state.sort.key===k?{key:k,dir:-state.sort.dir}:{key:k,dir:k==='date'||k==='id'||k==='parent'||k==='verdict'?1:-1};renderHistory()};
  for(const tr of el.querySelectorAll('tr.row'))tr.onclick=()=>{const k='h:'+tr.dataset.id;state.open.has(k)?state.open.delete(k):state.open.add(k);renderHistory()};
  const asc=H.runs.slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:0).map((r,i)=>({...r,i}));
  const ticks=[];let last=null;for(const r of asc)if(r.date!==last){ticks.push([r.i,(r.date||'').slice(5)]);last=r.date}
  const box=$('#hfigs');
  const mk=(title,sub,gets,o)=>{const f=figure(title,sub);box.appendChild(f);
    const ser=gets.map(([n,c,g])=>({name:n,color:c,dots:true,r:3.5,points:asc.filter(r=>g(r)!=null).map(r=>[r.i,g(r),r.id])}));
    lineChart($('.plot',f),ser,{title,xticks:ticks,fx:v=>asc[Math.round(v)]?.date||'',endLabels:false,...o});legend(f,ser)};
  mk('L1 Elo by run','ledger order',[['L1 Elo','--c1',r=>r.elo]],{refs:[0]});
  mk('Benchmark vs bot','ledger order',[['sampled','--c2',r=>r.sampled],['greedy','--c3',r=>r.greedy]],{fy:fmt.pct,refs:[.5]});
}

/* ---------- plumbing ---------- */
function render(){state.view==='live'?renderLive():renderHistory()}
function show(v){state.view=v;$('#live').style.display=v==='live'?'grid':'none';$('#history').style.display=v==='history'?'grid':'none';
  $('#tab-live').setAttribute('aria-pressed',v==='live');$('#tab-history').setAttribute('aria-pressed',v==='history');
  if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);if(v==='history'&&!state.hist)loadHistory();render()}
$('#tab-live').onclick=()=>show('live');$('#tab-history').onclick=()=>show('history');
async function loadHistory(){try{state.hist=await (await fetch('api/history',{cache:'no-store'})).json();render()}catch(e){}}
let failures=0;
async function poll(){
  try{const d=await (await fetch('api/state',{cache:'no-store'})).json();failures=0;
    if(d.snapshot){state.live=d.snapshot;nameRuns(state.live.runs);
      if(!state.seeded){state.seeded=true;const fresh=state.live.runs.some(r=>r.status==='running'||(r.metrics_age_s!=null&&r.metrics_age_s<86400));
        if(fresh)for(const r of state.live.runs)if(r.status!=='running'&&!(r.metrics_age_s!=null&&r.metrics_age_s<86400))state.hidden.add(r.id)}}
    const age=d.last_attempt?Date.now()/1000-d.last_attempt:null,bad=d.error||(age!=null&&age>60);
    $('#conn').innerHTML=`<span class="dot ${d.error?'bad':bad?'stale':''}"></span>${d.snapshot?esc(d.snapshot.host)+' · updated '+fmt.age(Date.now()/1000-d.snapshot.observed_at):'no data'}`;
    $('#banner').innerHTML=d.error?`<div class="banner bad">Snapshot error, showing last data: ${esc(d.error)}</div>`:'';
    if(state.view==='live'&&!document.querySelector('#live details[open]'))renderLive()}
  catch(e){failures++;$('#conn').innerHTML=`<span class="dot bad"></span>server unreachable`}
}
show(location.hash==='#history'?'history':'live');poll();setInterval(poll,15000);
</script>
