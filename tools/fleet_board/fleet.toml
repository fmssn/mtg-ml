# Fleet board config. Edit this file when the setup changes; collect.py and render.py stay as they are.
# Colour keys must be one of: pilot, base, opt (see render.py PALETTE).

title = "mtg-ml fleet board"
timezone = "Europe/Berlin"
window_minutes = 45            # trailing window for games/h
footer = """Most runs use one learner GPU, one inference-server GPU and about 32 cores; the full-box base run on h100-private4 uses all 8 GPUs and 128 threads. \
CPU is the limit on every box: two 32-core runs fill a 64-core machine. \
Trackers: gpu-server(1,3,4).tailc02128.ts.net:8444."""

# Legend and role colours.
[[roles]]
key = "pilot"
label = "Pilot league, round 3"
[[roles]]
key = "base"
label = "Base model training"
[[roles]]
key = "opt"
label = "Full-box run"

# One entry per machine. `color` is the default role colour of its runs and tiles.
# `runs` are globs expanded ON the box; a directory counts as a run if it has metrics.jsonl or process.json.
# `gpus` annotate a PCI bus (last two hex digits of the bus id). kind: foreign (not ours) or dead (broken).
# An annotation shows only while none of our runs uses that GPU.
[[machines]]
name = "h100-private"
ssh = "h100-private"
role = "Pilot league + base"
color = "pilot"
runs = [{ glob = "~/mtg-ml-r8/campaigns/r10*/r10-*" }, { glob = "~/mtg-ml-base/campaigns/*/*" }]
[machines.gpus]
"2F" = { label = "ComfyUI", note = "off limits", kind = "foreign" }
"38" = { label = "ComfyUI", note = "off limits", kind = "foreign" }
"BE" = { label = "Broken", note = "fell off the bus", kind = "dead" }

[[machines]]
name = "h100-private2"
ssh = "h100-private2"
role = "Pilot league + base"
color = "pilot"
runs = [{ glob = "~/mtg-ml-r8/campaigns/r10*/r10-*" }, { glob = "~/mtg-ml-base/campaigns/*/*" }]
[machines.gpus]
"2F" = { label = "ComfyUI", note = "off limits", kind = "foreign" }
"38" = { label = "ComfyUI (reserved)", note = "off limits", kind = "foreign" }
"BE" = { note = "suspect, untested" }

[[machines]]
name = "h100-private3"
ssh = "h100-private3"
role = "Base models"
color = "base"
runs = [{ glob = "~/mtg-ml-base/campaigns/*/*" }]

[[machines]]
name = "h100-private4"
ssh = "h100-private4"
role = "Full-box base model"
color = "opt"
cpu_label = "threads"
runs = [{ glob = "~/mtg-ml-base/campaigns/*/*" }]

# Watchdog (python -m tools.fleet_board.watch). Every key is optional; these are the defaults.
# Run scope: the machines' `runs` globs, unless [watch.runs] lists globs for a machine (replaces them).
[watch]
interval = 10                  # minutes between checks
max_minutes = 60               # exit 0 after this long without events
stall_minutes = 20             # running run with no train.log / metrics.jsonl write for this long
unreachable_checks = 2         # consecutive failed checks before a machine is reported
max_error_lines = 3            # error lines returned per run per check
error_patterns = ["Traceback", "OutOfMemory", "out of memory", "CUDA error", "\\bKilled\\b", "NativeRulesError"]
crash_status = ["failed", "crashed"]
done_status = ["complete", "completed"]
exclude = []                   # regexes on run names to ignore
# [watch.runs]
# h100-private4 = ["~/mtg-ml/opt/ab/*"]

# Workstream cards: the only hand-written text. Plain English, a few sentences each.
[[streams]]
title = "Pilot league - round 3"
color = "pilot"
headline = "Each deck's round-2 pilot trains against the other five frozen round-2 pilots."
text = "Round 2 beat round 1 in every deck and is live on the play site. Round 3 queues three decks per box (h100-private: Affinity, Madness; h100-private2: Blue, Elves, Tron); the Jund run crashed out of GPU memory and is not resumed."

[[streams]]
title = "Base models"
color = "base"
headline = "Generalists from scratch, 40M games each: h256 and h512 on h100-private3, plus lr variants h256 lr 1e-4 and h512 lr 3.75e-5."
text = "The first two plateaued near L1 -75 to -83; the lr variants test whether the learning rate is the cause."

[[streams]]
title = "Full-box base model"
color = "opt"
headline = "One h256 base run on all of h100-private4: 4 learner GPUs, 4 inference GPUs, 128 threads, varied decklists."
text = "Uses the fast recipe chosen on 2026-10-10 (2 epochs, bf16 GRU, faster featurization): about 1.9x the games/h of the old recipe per GPU pair."

[[streams]]
title = "Play site"
color = ""
headline = "play.mtg-ml.com runs the six round-2 pilots, the Jund vs Blue specialist and the legacy Delver bot."
text = ""

# Run descriptions for the table: first rule whose regex matches the run name or handle wins.
[[describe]]
match = "pilot"
text = "Pilot vs frozen round-2 pilots"
[[describe]]
match = "base-h256"
text = "Generalist from scratch, width 256"
[[describe]]
match = "base-h512"
text = "Generalist from scratch, width 512"
[[describe]]
match = "^(base|mb\\d+|gru.*)$"
text = "Learning A/B of an update speedup"
short = "A/B {name}"

# Strength charts: every run whose metrics contain ladder/elo gets one; `include` forces extra runs
# (matched against run name or handle) and `exclude` removes some.
[charts]
include = []
exclude = []

# Dashed reference lines on the L1 Elo charts.
# `match` is a regex on the run name/handle (omit for all); pilot ladders use a different scale.
[[reference]]
match = "base"
label = "r7 lr075 final (8.35M games)"
value = 5
