[project]
name = "mtg-ml"
version = "0.1.0"
description = "Rules engine and RL environment for Magic: The Gathering (Pauper): Jund Wildfire vs Mono Blue Terror"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = ["torch>=2.2", "numpy"]
review = ["anthropic"]  # only for `mtg_ml.review --backend claude`
expert-media = ["yt-dlp>=2026.3", "pillow>=10", "numpy"]
expert-asr = ["faster-whisper>=1.1"]
expert-ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4", "setuptools>=70"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mtg_ml*"]

[tool.setuptools.package-data]
"mtg_ml.engine" = ["cards.toml", "sideboard_plans.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["native/target"]

[tool.ruff.lint]
# Start with real bugs only (syntax errors, undefined names, unused imports/variables); widen later.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
